<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironi Ness Ziona — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface2: #eaf0f9;
    --border: rgba(30,80,180,0.1);
    --border2: rgba(30,80,180,0.2);
    --text: #0d1b3e;
    --muted: #4a6080;
    --dim: #8ca0bc;
    --accent: #e8630a;
    --accent2: #1a56c4;
    --red: #e8630a;
    --amber: #f0a84a;
    --blue: #1a56c4;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --score-1: #d63031;
    --score-2: #e17055;
    --score-3: #fdcb6e;
    --score-4: #81b214;
    --score-5: #00b894;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0;
    background: rgba(244,247,251,0.97);
    backdrop-filter: blur(8px); z-index: 100;
  }
  .logo-wrap { display: flex; align-items: center; gap: 12px; }
  .logo-text { display: flex; flex-direction: column; gap: 1px; }
  .logo-team { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.08em; color: var(--blue); text-transform: uppercase; line-height: 1; }
  .logo-sub  { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  #week-label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
  #refresh-btn {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: none; border: 1px solid var(--border2); color: var(--muted);
    padding: 6px 14px; border-radius: 4px; cursor: pointer;
    transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  #refresh-btn:hover { border-color: var(--blue); color: var(--blue); }
  #refresh-btn.loading { opacity: 0.5; pointer-events: none; }

  #status-bar {
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    text-align: center; padding: 6px; border-bottom: 1px solid var(--border);
    min-height: 24px; transition: color 0.3s;
  }
  #status-bar.error { color: var(--red); }
  #status-bar.ok    { color: var(--accent2); }

  /* ── MAIN LAYOUT ── */
  .main { padding: 28px 32px; max-width: 1100px; margin: 0 auto; }

  /* ── PAGE TABS (top-level: Workouts / Wellness) ── */
  .page-tabs {
    display: flex; gap: 0; border-bottom: 2px solid var(--border);
    margin-bottom: 28px;
  }
  .page-tab {
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--dim); padding: 12px 24px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    white-space: nowrap; transition: color 0.15s;
  }
  .page-tab:hover { color: var(--muted); }
  .page-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* ── ATHLETE TABS ── */
  .tabs-row {
    display: flex; gap: 0; border-bottom: 1px solid var(--border);
    margin-bottom: 28px; overflow-x: auto;
  }
  .tab {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--dim); padding: 10px 18px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    white-space: nowrap; transition: color 0.15s;
  }
  .tab:hover { color: var(--muted); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* ── METRIC CARDS ── */
  .metrics-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
  .metric-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .metric-value { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; }
  .metric-value span { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .metric-sub { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 4px; }

  /* ── CHARTS ── */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
  .chart-card-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .chart-wrap { position: relative; width: 100%; height: 200px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .leg-sq { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* ── TABLES ── */
  .section-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 32px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  th { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); background: var(--surface2); font-weight: 500; }
  th:first-child { text-align: left; width: 28%; }
  td { padding: 9px 14px; text-align: right; color: var(--text); border-bottom: 1px solid var(--border); }
  td:first-child { text-align: left; color: var(--muted); font-size: 11px; }
  tr:last-child td { border-bottom: none; }
  tr.total-row td { background: var(--surface2); font-weight: 600; font-family: var(--mono); font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-family: var(--mono); font-size: 10px; font-weight: 500; }

  /* ── INTENSITY SCALE ── */
  .intensity-scale { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 32px; font-size: 12px; }
  .is-header { display: grid; grid-template-columns: 52px 130px 1fr 1fr; background: var(--surface2); border-bottom: 1px solid var(--border); padding: 8px 14px; gap: 12px; }
  .is-score-h,.is-label-h,.is-def-h,.is-example-h { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .is-row { display: grid; grid-template-columns: 52px 130px 1fr 1fr; padding: 7px 14px; gap: 12px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--c) 30%, white); }
  .is-row:last-child { border-bottom: none; }
  .is-score { font-family: var(--mono); font-weight: 500; font-size: 14px; color: var(--t); }
  .is-label { font-weight: 600; color: var(--t); }
  .is-def,.is-example { color: var(--muted); font-size: 11px; }

  /* ── WELLNESS SECTION ── */
  .wellness-header-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .wellness-title { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .day-nav { display: flex; align-items: center; gap: 12px; }
  .day-nav-btn {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    background: none; border: 1px solid var(--border2); color: var(--muted);
    padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s;
  }
  .day-nav-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  .day-nav-btn:disabled { opacity: 0.3; pointer-events: none; }
  .day-nav-label { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text); min-width: 180px; text-align: center; }

  .wellness-status { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-bottom: 20px; min-height: 16px; }
  .wellness-status.ok    { color: var(--accent2); }
  .wellness-status.error { color: var(--red); }

  /* Pie grid */
  .pie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .pie-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
  .pie-card-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; text-align: center; }
  .pie-wrap { position: relative; height: 200px; }

  /* Savijauta line chart */
  .savijauta-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; margin-bottom: 24px; }
  .savijauta-wrap { position: relative; height: 200px; }

  /* Comment table */
  .comment-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
  .comment-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: auto; }
  .comment-table th { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); background: var(--surface2); font-weight: 500; }
  .comment-table td { padding: 9px 14px; text-align: left; color: var(--text); border-bottom: 1px solid var(--border); }
  .comment-table tr:last-child td { border-bottom: none; }
  .comment-table tr:hover td { background: var(--surface2); }

  .no-data { font-family: var(--mono); font-size: 11px; color: var(--dim); padding: 24px 0; text-align: center; }

  /* ── PIE DRILLDOWN ── */
  .drilldown {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 8px; padding: 16px 20px; margin-bottom: 24px;
    display: none; animation: fadeIn 0.15s ease;
  }
  .drilldown.visible { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
  .drilldown-title {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .drilldown-score-dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0;
  }
  .drilldown-players {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .drilldown-player {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 12px;
    font-size: 13px; font-weight: 500; color: var(--text);
  }

  .empty-state { padding: 48px; text-align: center; color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
  .skeleton { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="logo-text">
      <div class="logo-team">Ironi Ness Ziona</div>
      <div class="logo-sub" id="header-sub">Individual Workouts</div>
    </div>
  </div>
  <div class="header-right">
    <span id="week-label">—</span>
    <button id="refresh-btn" onclick="loadAll()">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M1 8a7 7 0 1 0 1.5-4.3"/><path d="M1 2v3h3"/>
      </svg>
      Refresh
    </button>
  </div>
</header>

<div id="status-bar">Loading data…</div>

<div class="main">

  <!-- ══ PAGE TABS ══ -->
  <div class="page-tabs">
    <div class="page-tab active" onclick="showPage('workouts')">Individual Workouts</div>
    <div class="page-tab" onclick="showPage('wellness')">Team Wellness</div>
  </div>

  <!-- ══ WORKOUTS PAGE ══ -->
  <div id="page-workouts">
    <div class="tabs-row" id="tabs-row"></div>
    <div id="panel-container"><div class="empty-state skeleton">Fetching athlete data…</div></div>
  </div>

  <!-- ══ WELLNESS PAGE ══ -->
  <div id="page-wellness" style="display:none;">
    <div class="wellness-header-row">
      <div class="wellness-title">Player Wellness</div>
      <div class="day-nav">
        <button class="day-nav-btn" onclick="shiftDay(-1)">← Prev day</button>
        <div class="day-nav-label" id="day-nav-label">Today</div>
        <button class="day-nav-btn" id="next-day-btn" onclick="shiftDay(1)" disabled>Next day →</button>
      </div>
    </div>
    <div class="wellness-status" id="wellness-status">Loading…</div>

    <div class="pie-grid">
      <div class="pie-card">
        <div class="pie-card-title">Fatigue</div>
        <div class="pie-wrap"><canvas id="pie-fatigue"></canvas></div>
      </div>
      <div class="pie-card">
        <div class="pie-card-title">Muscle Soreness</div>
        <div class="pie-wrap"><canvas id="pie-soreness"></canvas></div>
      </div>
      <div class="pie-card">
        <div class="pie-card-title">Sleep Quality</div>
        <div class="pie-wrap"><canvas id="pie-sleep"></canvas></div>
      </div>
    </div>

    <div class="drilldown" id="pie-drilldown">
      <div class="drilldown-title">
        <span class="drilldown-score-dot" id="drilldown-dot"></span>
        <span id="drilldown-title-text"></span>
      </div>
      <div class="drilldown-players" id="drilldown-players"></div>
    </div>

    <div class="savijauta-card">
      <div class="chart-card-title">Mood — weekly average</div>
      <div class="savijauta-wrap"><canvas id="mood-chart"></canvas></div>
    </div>

    <div class="comment-card" id="comment-card">
      <table class="comment-table">
        <thead><tr><th>Date</th><th>Player</th><th>Comment</th></tr></thead>
        <tbody id="comment-body"></tbody>
      </table>
    </div>
  </div>

</div><!-- /main -->

<script>
// ── CSV URLs ──────────────────────────────────────────────────────────────────
const WORKOUT_CSV  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8h3woy8ASxFEepex26EudzzqeygULXyYil2IcjMjJ6kmE6Jql60NHGwx8fD-U3yxiAPSv3SrLQSTW/pub?output=csv';
const WELLNESS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRn9Yytd5qEBHAtB6oNKfCiltSPfIX8ujUbZZmEr1TkWwdhXdDIOypq7PY7vbZNQixAZ0df7uuXL_SL/pub?output=csv';

// Score colors: 1=red … 5=green
const SCORE_COLORS = ['#d63031','#e17055','#fdcb6e','#81b214','#00b894'];

const gridC = 'rgba(30,80,180,0.08)';
const tickC = '#4a6080';

// ── STATE ─────────────────────────────────────────────────────────────────────
let athletes = [], currentAthlete = null;
const chartReg = {};
let wellnessRows = [], dayOffset = 0;
let moodChart;
let currentPage = 'workouts';

// ── PAGE SWITCHING ────────────────────────────────────────────────────────────
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.page-tab').forEach(t =>
    t.classList.toggle('active', t.textContent.toLowerCase().includes(page === 'workouts' ? 'workout' : 'wellness'))
  );
  document.getElementById('page-workouts').style.display = page === 'workouts' ? '' : 'none';
  document.getElementById('page-wellness').style.display  = page === 'wellness'  ? '' : 'none';
  document.getElementById('header-sub').textContent = page === 'workouts' ? 'Individual Workouts' : 'Team Wellness';
}

// ── REFRESH ALL ───────────────────────────────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('loading');
  await Promise.all([loadWorkouts(), loadWellness()]);
  btn.classList.remove('loading');
}

// ── WORKOUTS ──────────────────────────────────────────────────────────────────
async function loadWorkouts() {
  const status = document.getElementById('status-bar');
  status.className = '';
  status.textContent = 'Fetching latest data…';
  try {
    const res = await fetch(WORKOUT_CSV + '&t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const csv = await res.text();
    athletes = parseWorkoutCSV(csv);
    if (!athletes.length) throw new Error('No athlete data found');
    const now = new Date();
    document.getElementById('week-label').textContent =
      'Week of ' + now.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    status.className = 'ok';
    status.textContent = `✓ Updated — ${athletes.length} athletes · ${now.toLocaleTimeString()}`;
    buildAthleteTabs();
    showAthlete(currentAthlete && athletes.find(a=>a.name===currentAthlete) ? currentAthlete : athletes[0].name);
  } catch(e) {
    status.className = 'error';
    status.textContent = '✗ Could not load workout data. ' + e.message;
  }
}

function parseWorkoutCSV(csv) {
  csv = csv.replace(/^\uFEFF/, '');
  const sep = csv.indexOf('\t') !== -1 ? '\t' : ',';
  const lines = csv.trim().split('\n').map(l => l.split(sep));
  const headers = lines[0].map(h => h.trim());
  const rows = lines.slice(1)
    .map(l => { const o={}; headers.forEach((h,i)=>o[h]=(l[i]||'').trim()); return o; })
    .filter(r => r.athlete && r.activity);
  const byAthlete = {};
  rows.forEach(r => { if(!byAthlete[r.athlete]) byAthlete[r.athlete]=[]; byAthlete[r.athlete].push(r); });
  const days = ['mon','tue','wed','thu','fri','sat','sun'];
  return Object.entries(byAthlete).map(([name, rows]) => {
    const activities = rows.map(r => ({ name: r.activity, minutes: days.map(d=>parseInt(r[d])||0) }));
    const intensity  = days.map(d => parseInt(rows[0]['intensity_'+d])||0);
    const loading    = days.map(d => parseInt(rows[0]['loading_'+d])||0);
    const totalByDay = days.map((_,i) => activities.reduce((s,a)=>s+a.minutes[i],0));
    const activeDays = totalByDay.filter(t=>t>0).length;
    const totalVol   = totalByDay.reduce((s,v)=>s+v,0);
    const avgDur     = activeDays ? Math.round(totalVol/activeDays) : 0;
    const avgInt     = activeDays ? Math.round((intensity.filter(v=>v>0).reduce((s,v)=>s+v,0)/activeDays)*10)/10 : 0;
    const peakIdx    = totalByDay.indexOf(Math.max(...totalByDay));
    const dayLabels  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    return { name, activities, intensity, loading, totalByDay, totalVol, avgDur, avgInt, activeDays, peakDay: dayLabels[peakIdx] };
  });
}

function buildAthleteTabs() {
  const row = document.getElementById('tabs-row');
  row.innerHTML = athletes.map(a =>
    `<div class="tab" data-name="${a.name}" onclick="showAthlete('${a.name}')">${a.name}</div>`
  ).join('');
}

function showAthlete(name) {
  currentAthlete = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.name===name));
  const a = athletes.find(x=>x.name===name);
  if (!a) return;
  Object.values(chartReg).forEach(c=>c.destroy());
  Object.keys(chartReg).forEach(k=>delete chartReg[k]);
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function badgeStyle(z) {
    if (z===0) return 'background:#eaf0f9;color:#8ca0bc';
    if (z<=2)  return 'background:#ddeaff;color:#1a56c4';
    if (z<=5)  return 'background:#fff3e0;color:#cc6600';
    return 'background:#ffe8e0;color:#c0400a';
  }
  function actRow(actName) {
    const act = a.activities.find(x=>x.name===actName);
    const mins = act ? act.minutes : [0,0,0,0,0,0,0];
    return `<tr><td>${actName}</td>${mins.map(v=>`<td>${v||'—'}</td>`).join('')}</tr>`;
  }

  document.getElementById('panel-container').innerHTML = `
    <div class="metrics-row">
      <div class="metric"><div class="metric-label">Avg duration (active days)</div><div class="metric-value">${a.avgDur}<span>min</span></div><div class="metric-sub">per day</div></div>
      <div class="metric"><div class="metric-label">Avg intensity (active days)</div><div class="metric-value">${a.avgInt}<span>/ 10</span></div><div class="metric-sub">weekly average</div></div>
      <div class="metric"><div class="metric-label">Total volume</div><div class="metric-value">${a.totalVol}<span>min</span></div><div class="metric-sub">${a.activeDays} active days</div></div>
      <div class="metric"><div class="metric-label">Peak load day</div><div class="metric-value">${a.peakDay}</div><div class="metric-sub">${Math.max(...a.totalByDay)} min</div></div>
    </div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-card-title">Daily volume (min)</div>
        <div class="legend">
          <span class="leg"><span class="leg-sq" style="background:#1a56c4"></span>Str &amp; Power</span>
          <span class="leg"><span class="leg-sq" style="background:#e8630a"></span>Basketball Skills</span>
          <span class="leg"><span class="leg-sq" style="background:#8ca0bc"></span>Gen phys. prep</span>
          <span class="leg"><span class="leg-sq" style="background:#f0a84a"></span>Conditioning</span>
        </div>
        <div class="chart-wrap"><canvas id="vol-chart"></canvas></div>
      </div>
      <div class="chart-card">

// ── WELLNESS ──────────────────────────────────────────────────────────────────
async function loadWellness() {
  const status = document.getElementById('wellness-status');
  status.className = 'wellness-status';
  status.textContent = 'Loading wellness data…';
  try {
    const res = await fetch(WELLNESS_CSV + '&t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    wellnessRows = parseWellnessCSV(text);
    renderWellness();
  } catch(e) {
    status.className = 'wellness-status error';
    status.textContent = '✗ Could not load wellness data. ' + e.message;
  }
}

function parseWellnessCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const sep = text.indexOf('\t') !== -1 ? '\t' : ',';
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(sep).map(h => h.trim());
  return lines.slice(1).map(l => {
    const cols = l.split(sep);
    const o = {};
    headers.forEach((h,i) => o[h] = (cols[i]||'').trim());
    return o;
  }).filter(r => r['Timestamp']);
}

function extractScore(val) {
  if (!val) return null;
  const m = (val||'').match(/^(\d)/);
  return m ? parseInt(m[1]) : null;
}

function formatDateKey(date) {
  return `${date.getMonth()+1}/${date.getDate()}/${date.getFullYear()}`;
}

function getTargetDate() {
  const d = new Date();
  d.setDate(d.getDate() + dayOffset);
  return d;
}

function shiftDay(delta) {
  dayOffset += delta;
  if (dayOffset > 0) dayOffset = 0;
  renderWellness();
}

function buildPie(canvasId, categoryKey, categoryLabel, dayRows) {
  const existing = Chart.getChart(canvasId);
  if (existing) existing.destroy();

  // Build score → players map
  const scoreMap = {1:[],2:[],3:[],4:[],5:[]};
  dayRows.forEach(row => {
    const score = extractScore(row[categoryKey]);
    const name  = (row['Name']||'').trim();
    if (score >= 1 && score <= 5 && name) scoreMap[score].push(name);
  });

  const labels=[], data=[], colors=[], scoreNums=[];
  [1,2,3,4,5].forEach(n => {
    if (scoreMap[n].length > 0) {
      labels.push(`${n}`); data.push(scoreMap[n].length);
      colors.push(SCORE_COLORS[n-1]); scoreNums.push(n);
    }
  });
  if (!data.length) return;

  const chart = new Chart(document.getElementById(canvasId), {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:2, borderColor:'transparent', hoverOffset:8 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ display:true, position:'bottom', labels:{ color:tickC, font:{size:11}, boxWidth:12, padding:8 } },
        tooltip:{ callbacks:{ label: ctx => ` Score ${ctx.label}: ${ctx.raw} player${ctx.raw>1?'s':''}` } }
      },
      onClick(evt, elements) {
        if (!elements.length) return;
        const idx   = elements[0].index;
        const score = scoreNums[idx];
        const color = SCORE_COLORS[score-1];
        const players = scoreMap[score];
        showDrilldown(categoryLabel, score, color, players);
      }
    }
  });
}

function showDrilldown(category, score, color, players) {
  const panel = document.getElementById('pie-drilldown');
  document.getElementById('drilldown-dot').style.background = color;
  document.getElementById('drilldown-title-text').textContent =
    `${category} — Score ${score} · ${players.length} player${players.length>1?'s':''}`;
  document.getElementById('drilldown-players').innerHTML =
    players.map(p => `<span class="drilldown-player">${p}</span>`).join('');
  panel.classList.add('visible');
}

function buildMoodChart() {
  // Group all rows by date, average MOOD score
  const byDate = {};
  wellnessRows.forEach(row => {
    const ts = row['Timestamp']; if (!ts) return;
    const date = ts.split(' ')[0];
    const score = extractScore(row['MOOD']);
    if (score === null) return;
    if (!byDate[date]) byDate[date] = [];
    byDate[date].push(score);
  });
  const sorted = Object.keys(byDate).sort((a,b)=>new Date(a)-new Date(b)).slice(-7);
  const labels = sorted.map(d => { const dt=new Date(d); return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}`; });
  const avgs   = sorted.map(d => parseFloat((byDate[d].reduce((s,v)=>s+v,0)/byDate[d].length).toFixed(2)));
  if (moodChart) moodChart.destroy();
  moodChart = new Chart(document.getElementById('mood-chart'), {
    type:'line',
    data:{ labels, datasets:[{ label:'Avg Mood', data:avgs, borderColor:'#1a56c4', backgroundColor:'rgba(26,86,196,0.08)', borderWidth:2, pointRadius:5, pointBackgroundColor:'#1a56c4', tension:0.3, fill:true }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>` Avg mood: ${ctx.raw}`}} },
      scales:{
        x:{ticks:{color:tickC,font:{size:11}},grid:{color:gridC},border:{display:false}},
        y:{min:1,max:5,ticks:{color:tickC,font:{size:11},stepSize:1},grid:{color:gridC},border:{display:false}}
      }
    }
  });
}

function renderWellness() {
  const target    = getTargetDate();
  const targetKey = formatDateKey(target);
  const todayKey  = formatDateKey(new Date());
  const isToday   = targetKey === todayKey;
  const dateStr   = target.toLocaleDateString('en-GB', {day:'2-digit',month:'2-digit',year:'numeric'});
  document.getElementById('day-nav-label').textContent = isToday ? `Today — ${dateStr}` : `Previous day — ${dateStr}`;
  document.getElementById('next-day-btn').disabled = isToday;

  const dayRows = wellnessRows.filter(r => (r['Timestamp']||'').split(' ')[0] === targetKey);
  const status  = document.getElementById('wellness-status');

  if (!dayRows.length) {
    status.className = 'wellness-status error';
    status.textContent = `No wellness responses for ${dateStr}`;
    ['pie-fatigue','pie-soreness','pie-sleep'].forEach(id => { const c=Chart.getChart(id); if(c) c.destroy(); });
    document.getElementById('comment-body').innerHTML = `<tr><td colspan="3" class="no-data">No responses for this day</td></tr>`;
    buildMoodChart();
    return;
  }

  status.className = 'wellness-status ok';
  status.textContent = `✓ ${dayRows.length} response${dayRows.length>1?'s':''} for ${dateStr}`;

  // Hide previous drilldown when day changes
  document.getElementById('pie-drilldown').classList.remove('visible');

  buildPie('pie-fatigue',  'FATIGUE',         'Fatigue',         dayRows);
  buildPie('pie-soreness', 'MUSCLE SORENESS', 'Muscle Soreness', dayRows);
  buildPie('pie-sleep',    'SLEEP QUALITY',   'Sleep Quality',   dayRows);

  buildMoodChart();

  // Comments
  const tbody = document.getElementById('comment-body');
  tbody.innerHTML = '';
  let hasComments = false;
  dayRows.forEach(row => {
    const comment = (row['[Optional] Comments or anything that concern you']||'').trim();
    if (!comment) return;
    hasComments = true;
    const ts = (row['Timestamp']||'').split(' ')[0];
    const dt = new Date(ts);
    const d  = `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
    const name = (row['Name']||'').trim();
    tbody.innerHTML += `<tr><td style="color:var(--dim);white-space:nowrap;">${d}</td><td style="font-weight:500;white-space:nowrap;">${name}</td><td>${comment}</td></tr>`;
  });
  if (!hasComments) tbody.innerHTML = `<tr><td colspan="3" class="no-data">No comments for this day</td></tr>`;
}
